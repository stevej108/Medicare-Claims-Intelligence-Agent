name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run deterministic tests
        run: |
          pytest tests/test_api.py -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: medicare-claims-api:ci     
        
    - name: Start Docker container
      run: |
          docker run -d \
            --name medicare-claims-api \
            -p 8000:8000 \
            medicare-claims-api:ci

    - name: Wait for the API to be ready
      run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs medicare-claims-api
          exit 1

    - name: Stop Docker container
      if: always()
      run: |
        docker rm -f medicare-claims-api || true      
    